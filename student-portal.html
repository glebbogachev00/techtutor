<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTutor - Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .primary-gradient {
            background: linear-gradient(135deg, #193b92 0%, #2563eb 100%);
        }
        .teal-gradient {
            background: linear-gradient(135deg, #2C7A7B 0%, #319795 100%);
        }
        .gold-gradient {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .medal {
            font-size: 3rem;
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .medal.earned {
            animation: medalShine 2s infinite;
        }
        .medal.locked {
            filter: grayscale(100%);
            opacity: 0.5;
        }
        @keyframes medalShine {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .trophy {
            font-size: 4rem;
            animation: trophyBounce 1s infinite;
        }
        @keyframes trophyBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .avatar {
            font-size: 5rem;
            animation: avatarRotate 3s ease-in-out infinite;
        }
        @keyframes avatarRotate {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        .celebration {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: white;
            padding: 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: celebrationPop 0.5s ease-out;
        }
        @keyframes celebrationPop {
            0% { transform: translate(-50%, -50%) scale(0); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1999;
        }
        .progress-bar {
            transition: width 0.5s ease;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full">
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <div class="text-center mb-8">
                    <div class="primary-gradient w-16 h-16 rounded-xl mx-auto mb-4 flex items-center justify-center">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-900">Student Portal</h1>
                    <p class="text-gray-600 mt-2">Welcome to TechTutor</p>
                </div>
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Student ID</label>
                        <input type="text" id="loginStudentId" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" id="loginPassword" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                    </div>
                    <div id="loginError" class="text-red-600 text-sm hidden"></div>
                    <button type="submit" class="w-full primary-gradient text-white py-3 rounded-lg font-semibold hover:opacity-90 transition">
                        Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Student Dashboard -->
    <div id="studentDashboard" class="hidden">
        <!-- Header -->
        <header class="primary-gradient shadow-lg">
            <div class="container mx-auto px-4 py-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <div class="bg-white bg-opacity-20 p-3 rounded-xl">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold text-white" id="welcomeName">Welcome!</h1>
                            <p class="text-blue-100">Student Dashboard</p>
                        </div>
                    </div>
                    <button onclick="logout()" class="bg-white bg-opacity-20 text-white px-6 py-2 rounded-lg hover:bg-opacity-30 transition">
                        Logout
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="container mx-auto px-4 py-8">
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white rounded-2xl shadow-lg p-6 card-hover">
                    <div class="flex items-center space-x-4">
                        <div class="bg-blue-100 p-4 rounded-xl">
                            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </div>
                        <div>
                            <p class="text-gray-600 text-sm">Projects</p>
                            <p class="text-3xl font-bold text-gray-900" id="projectsCount">0</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-lg p-6 card-hover">
                    <div class="flex items-center space-x-4">
                        <div class="bg-yellow-100 p-4 rounded-xl">
                            <svg class="w-8 h-8 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                            </svg>
                        </div>
                        <div>
                            <p class="text-gray-600 text-sm">Achievements</p>
                            <p class="text-3xl font-bold text-gray-900" id="achievementsCount">0</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-lg p-6 card-hover">
                    <div class="flex items-center space-x-4">
                        <div class="bg-green-100 p-4 rounded-xl">
                            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                            </svg>
                        </div>
                        <div>
                            <p class="text-gray-600 text-sm">Courses Completed</p>
                            <p class="text-3xl font-bold text-gray-900" id="coursesCount">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Documents Section -->
            <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Documents</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- EOC Report -->
                    <div class="border border-gray-200 rounded-lg p-4">
                        <h3 class="font-semibold mb-3">EOC Report</h3>
                        <div id="eocReportSection">
                            <p class="text-gray-500 text-sm">No report available</p>
                        </div>
                    </div>

                    <!-- Certificate -->
                    <div class="border border-gray-200 rounded-lg p-4">
                        <h3 class="font-semibold mb-3">Certificate</h3>
                        <div id="certificateSection">
                            <p class="text-gray-500 text-sm">No certificate available</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Portfolio Section -->
            <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Portfolio</h2>
                <div id="portfolioSection" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Portfolio items will be loaded here -->
                </div>
            </div>

            <!-- Achievements Section -->
            <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Achievements</h2>
                <div id="achievementsSection" class="space-y-4">
                    <!-- Achievements will be loaded here -->
                </div>
            </div>

            <!-- Program Progression Section -->
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Program Progression</h2>
                <div id="coursesProgress" class="space-y-6">
                    <!-- Courses will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStudent = null;
        const avatars = ['👨‍🚀', '🦸‍♂️', '🧙‍♂️', '🦹‍♀️', '👩‍🎨', '🧑‍🔬', '👑'];

        // Initialize
        window.onload = function() {
            checkAuth();
        };

        // Authentication
        function checkAuth() {
            const loggedInId = localStorage.getItem('techtutor_student_logged_in');
            if (loggedInId) {
                loadStudent(loggedInId);
            } else {
                showLogin();
            }
        }

        function showLogin() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('studentDashboard').classList.add('hidden');
        }

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('studentDashboard').classList.remove('hidden');
            renderDashboard();
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const studentId = document.getElementById('loginStudentId').value;
            const password = document.getElementById('loginPassword').value;

            const students = JSON.parse(localStorage.getItem('techtutor_students') || '[]');
            const student = students.find(s => s.id === studentId && s.password === password);

            if (student) {
                localStorage.setItem('techtutor_student_logged_in', studentId);
                currentStudent = student;
                showDashboard();
            } else {
                const errorDiv = document.getElementById('loginError');
                errorDiv.textContent = 'Invalid Student ID or Password';
                errorDiv.classList.remove('hidden');
            }
        });

        function logout() {
            localStorage.removeItem('techtutor_student_logged_in');
            currentStudent = null;
            window.location.href = 'index.html';
        }

        function loadStudent(studentId) {
            const students = JSON.parse(localStorage.getItem('techtutor_students') || '[]');
            currentStudent = students.find(s => s.id === studentId);
            if (currentStudent) {
                showDashboard();
            } else {
                showLogin();
            }
        }

        function renderDashboard() {
            if (!currentStudent) return;

            // Welcome message
            document.getElementById('welcomeName').textContent = `Welcome, ${currentStudent.name}!`;

            // Stats
            document.getElementById('projectsCount').textContent = currentStudent.portfolio.length;
            document.getElementById('achievementsCount').textContent = currentStudent.achievements.length;

            // Count completed courses
            const completedCourses = currentStudent.courses.filter(course =>
                course.levels.every(level => level.completed)
            ).length;
            document.getElementById('coursesCount').textContent = completedCourses;

            // Render sections
            renderCourses();
            renderDocuments();
            renderPortfolio();
            renderAchievements();
        }

        function renderCourses() {
            const container = document.getElementById('coursesProgress');

            container.innerHTML = currentStudent.courses.map(course => {
                const completedLevels = course.levels.filter(l => l.completed).length;
                const totalLevels = course.levels.length;
                const progress = (completedLevels / totalLevels) * 100;
                const allCompleted = completedLevels === totalLevels;

                // Check if course has trophy and avatar
                if (!course.trophy) course.trophy = null;
                if (!course.avatar) course.avatar = null;

                return `
                    <div class="border border-gray-200 rounded-lg p-6">
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex-1">
                                <h3 class="font-semibold text-lg">${course.name}</h3>
                                <div class="mt-2">
                                    <div class="flex justify-between text-sm text-gray-600 mb-1">
                                        <span>Progress</span>
                                        <span>${completedLevels}/${totalLevels} levels</span>
                                    </div>
                                    <div class="w-full bg-gray-200 rounded-full h-2">
                                        <div class="progress-bar h-2 rounded-full ${allCompleted ? 'bg-green-500' : 'bg-blue-500'}" style="width: ${progress}%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Medals & Trophy Section -->
                        <div class="mt-4 p-4 ${allCompleted ? 'gold-gradient' : 'bg-gray-50'} rounded-lg">
                            <h4 class="text-sm font-semibold ${allCompleted ? 'text-white' : 'text-gray-700'} mb-3">
                                ${allCompleted ? 'Course Mastered!' : 'Your Progress'}
                            </h4>
                            <div class="grid grid-cols-4 gap-4">
                                <!-- Explorer Medal -->
                                <div class="text-center">
                                    <div class="medal ${course.levels[0].completed ? 'earned' : 'locked'}">
                                        ${course.levels[0].completed ? '🥇' : '🔒'}
                                    </div>
                                    <p class="text-xs ${allCompleted ? 'text-white' : 'text-gray-600'} mt-2 font-semibold">Explorer</p>
                                    <p class="text-[10px] ${allCompleted ? 'text-white/80' : 'text-gray-500'}">${course.levels[0].completed ? 'Earned!' : 'Locked'}</p>
                                </div>

                                <!-- Builder Medal -->
                                <div class="text-center">
                                    <div class="medal ${course.levels[1].completed ? 'earned' : 'locked'}">
                                        ${course.levels[1].completed ? '🥇' : '🔒'}
                                    </div>
                                    <p class="text-xs ${allCompleted ? 'text-white' : 'text-gray-600'} mt-2 font-semibold">Builder</p>
                                    <p class="text-[10px] ${allCompleted ? 'text-white/80' : 'text-gray-500'}">${course.levels[1].completed ? 'Earned!' : 'Locked'}</p>
                                </div>

                                <!-- Creator Medal -->
                                <div class="text-center">
                                    <div class="medal ${course.levels[2].completed ? 'earned' : 'locked'}">
                                        ${course.levels[2].completed ? '🥇' : '🔒'}
                                    </div>
                                    <p class="text-xs ${allCompleted ? 'text-white' : 'text-gray-600'} mt-2 font-semibold">Creator</p>
                                    <p class="text-[10px] ${allCompleted ? 'text-white/80' : 'text-gray-500'}">${course.levels[2].completed ? 'Earned!' : 'Locked'}</p>
                                </div>

                                <!-- Trophy & Avatar -->
                                <div class="text-center">
                                    ${allCompleted ? `
                                        <div class="medal earned">
                                            🏆
                                        </div>
                                        <p class="text-xs text-white mt-2 font-semibold">Trophy</p>
                                        <div class="avatar mt-2">${course.avatar || getRandomAvatar(course)}</div>
                                    ` : `
                                        <div class="medal locked">
                                            🔒
                                        </div>
                                        <p class="text-xs text-gray-600 mt-2 font-semibold">Trophy</p>
                                        <p class="text-[10px] text-gray-500">Complete all</p>
                                    `}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getRandomAvatar(course) {
            if (!course.avatar) {
                course.avatar = avatars[Math.floor(Math.random() * avatars.length)];
                saveCurrentStudent();

                // Show celebration
                showCelebration(course.name, course.avatar);
            }
            return course.avatar;
        }

        function showCelebration(courseName, avatar) {
            const overlay = document.createElement('div');
            overlay.className = 'overlay';

            const celebration = document.createElement('div');
            celebration.className = 'celebration';
            celebration.innerHTML = `
                <div class="trophy mb-4">🏆</div>
                <h2 class="text-3xl font-bold text-gray-900 mb-2">Congratulations!</h2>
                <p class="text-lg text-gray-700 mb-4">You've completed ${courseName}!</p>
                <div class="avatar mb-4">${avatar}</div>
                <p class="text-gray-600 mb-6">You've unlocked a special avatar!</p>
                <button onclick="closeCelebration()" class="primary-gradient text-white px-8 py-3 rounded-lg font-semibold">
                    Awesome!
                </button>
            `;

            document.body.appendChild(overlay);
            document.body.appendChild(celebration);

            window.closeCelebration = function() {
                document.body.removeChild(overlay);
                document.body.removeChild(celebration);
            };
        }

        function saveCurrentStudent() {
            const students = JSON.parse(localStorage.getItem('techtutor_students') || '[]');
            const index = students.findIndex(s => s.id === currentStudent.id);
            if (index !== -1) {
                students[index] = currentStudent;
                localStorage.setItem('techtutor_students', JSON.stringify(students));
            }
        }

        function renderDocuments() {
            // EOC Report
            const eocSection = document.getElementById('eocReportSection');
            if (currentStudent.documents.eocReport) {
                eocSection.innerHTML = `
                    <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg">
                        <div class="flex items-center space-x-3">
                            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            <span class="text-sm font-medium">${currentStudent.documents.eocReport.name}</span>
                        </div>
                        <button onclick="downloadDocument('eocReport')" class="text-blue-600 hover:text-blue-800 text-sm font-semibold">
                            Download
                        </button>
                    </div>
                `;
            } else {
                eocSection.innerHTML = '<p class="text-gray-500 text-sm">No report available</p>';
            }

            // Certificate
            const certSection = document.getElementById('certificateSection');
            if (currentStudent.documents.certificate) {
                certSection.innerHTML = `
                    <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg">
                        <div class="flex items-center space-x-3">
                            <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path>
                            </svg>
                            <span class="text-sm font-medium">${currentStudent.documents.certificate.name}</span>
                        </div>
                        <button onclick="downloadDocument('certificate')" class="text-blue-600 hover:text-blue-800 text-sm font-semibold">
                            Download
                        </button>
                    </div>
                `;
            } else {
                certSection.innerHTML = '<p class="text-gray-500 text-sm">No certificate available</p>';
            }
        }

        function downloadDocument(type) {
            const doc = currentStudent.documents[type];
            const link = document.createElement('a');
            link.href = doc.data;
            link.download = doc.name;
            link.click();
        }

        function renderPortfolio() {
            const container = document.getElementById('portfolioSection');

            if (currentStudent.portfolio.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm col-span-2">No portfolio items yet</p>';
                return;
            }

            container.innerHTML = currentStudent.portfolio.map(item => `
                <div class="border border-gray-200 rounded-lg p-6 card-hover">
                    <h3 class="font-semibold text-lg mb-2">${item.title}</h3>
                    <p class="text-gray-600 text-sm mb-4">${item.description}</p>

                    ${item.video ? `
                        <div class="mb-4">
                            <video controls class="w-full rounded-lg">
                                <source src="${item.video.data}" type="${item.video.type}">
                                Your browser does not support the video tag.
                            </video>
                        </div>
                    ` : ''}

                    ${item.link ? `
                        <a href="${item.link}" target="_blank" class="inline-flex items-center text-blue-600 hover:text-blue-800 text-sm font-semibold">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                            </svg>
                            View Project
                        </a>
                    ` : ''}
                </div>
            `).join('');
        }

        function renderAchievements() {
            const container = document.getElementById('achievementsSection');

            if (currentStudent.achievements.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">No achievements yet</p>';
                return;
            }

            container.innerHTML = currentStudent.achievements.map(item => `
                <div class="border border-gray-200 rounded-lg p-6 card-hover">
                    <div class="flex items-start space-x-4">
                        <div class="bg-yellow-100 p-3 rounded-xl">
                            <svg class="w-8 h-8 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                            </svg>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-semibold text-lg">${item.title}</h3>
                            <p class="text-gray-600 text-sm mt-1">${item.description}</p>
                            <p class="text-gray-500 text-sm mt-2">${formatDate(item.date)}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }
