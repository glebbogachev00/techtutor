<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4MZ1XEZXB6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4MZ1XEZXB6');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TechTutor Academy - Best Tech Education in the World">
  <title>TechTutor Academy</title>
  <link rel="icon" type="image/png" href="images/robot-rocket.png">

  <!-- Automatic redirect for users without JavaScript -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=en/index.html">
  </noscript>

  <!-- Instant redirect script - NO loading page -->
  <script>
    (function() {
      'use strict';

      // Check if user has manually selected a language before
      const savedLang = localStorage.getItem('tt-lang-manual');

      if (savedLang) {
        // User has previously chosen a language - redirect immediately
        window.location.replace(savedLang + '/index.html');
        return;
      }

      // Detect language based on geo-location with timeout
      detectLanguageAndRedirect();

      async function detectLanguageAndRedirect() {
        let targetLang = 'en'; // Default fallback

        try {
          // Use CloudFlare's free IP geolocation API with timeout
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2000); // 2 second timeout

          const response = await fetch('https://cloudflare.com/cdn-cgi/trace', {
            method: 'GET',
            signal: controller.signal
          });

          clearTimeout(timeoutId);

          const data = await response.text();
          const lines = data.split('\n');
          const locationLine = lines.find(line => line.startsWith('loc='));

          if (locationLine) {
            const countryCode = locationLine.split('=')[1];

            // Vietnam = VN, redirect to Vietnamese
            if (countryCode === 'VN') {
              targetLang = 'vn';
            }
          }
        } catch (error) {
          console.log('Geo-detection failed, defaulting to English');
          // Default to English on any error
        }

        // Perform instant redirect - always happens even if fetch fails
        window.location.replace(targetLang + '/index.html');
      }
    })();
  </script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #193b92 0%, #2C7A7B 100%);
      color: white;
    }

    .container {
      text-align: center;
      padding: 40px;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .lang-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }

    .lang-button {
      padding: 12px 30px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .lang-button:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: white;
      transform: translateY(-2px);
    }

    @media (max-width: 640px) {
      .lang-buttons {
        flex-direction: column;
        align-items: center;
      }

      .lang-button {
        width: 200px;
      }
    }
  </style>
</head>
<body>
  <!-- Fallback content (only shown if JavaScript fails) -->
  <div class="container">
    <img src="images/robot-rocket.png" alt="TechTutor Logo" class="logo">
    <h1>Choose Your Language / Chọn Ngôn Ngữ</h1>
    <div class="lang-buttons">
      <a href="index.html" class="lang-button">🇬🇧 English</a>
      <a href="vn/index.html" class="lang-button">🇻🇳 Tiếng Việt</a>
    </div>
  </div>

  <!-- Geo-redirect script -->
  <script src="js/geo-redirect.js"></script>
</body>
</html>
