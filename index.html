<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4MZ1XEZXB6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4MZ1XEZXB6');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TechTutor Academy - Best Tech Education in the World. Interactive tech courses for children and teens.">
  <title>TechTutor Academy — Redirecting...</title>
  <link rel="icon" type="image/png" href="images/robot-rocket.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #193b92 0%, #2C7A7B 100%);
      color: white;
    }

    .loader-container {
      text-align: center;
      animation: fadeIn 0.3s ease-in;
    }

    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      animation: pulse 2s infinite;
    }

    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .manual-links {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 40px;
    }

    .manual-links a {
      padding: 12px 30px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .manual-links a:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: white;
      transform: translateY(-2px);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 1.5rem;
      }

      p {
        font-size: 1rem;
      }

      .manual-links {
        flex-direction: column;
        align-items: center;
      }

      .manual-links a {
        width: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="loader-container">
    <img src="images/robot-rocket.png" alt="TechTutor Logo" class="logo">
    <h1>TechTutor Academy</h1>
    <div class="spinner"></div>
    <p>Redirecting to your language...</p>

    <div class="manual-links">
      <a href="/en/">🇬🇧 English</a>
      <a href="/vn/">🇻🇳 Tiếng Việt</a>
    </div>
  </div>

  <script src="js/geo-redirect.js"></script>
</body>
</html>
