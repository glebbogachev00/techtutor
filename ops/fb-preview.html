<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Preview — TechTutor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0a0a0c;
    color: #e8e8e8;
    font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    min-height: 100vh;
    padding: 20px;
  }
  .frame { max-width: 600px; margin: 0 auto; }
  .toggle {
    display: flex;
    gap: 0;
    width: 100%;
    margin-bottom: 24px;
    border: 1px solid #1f2937;
    border-radius: 8px;
    overflow: hidden;
  }
  .toggle button {
    flex: 1;
    padding: 14px 16px;
    background: transparent;
    color: #6b7280;
    font-family: inherit;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  .toggle button.active {
    background: #193B92;
    color: #fff;
  }
  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #6b7280;
    margin-bottom: 6px;
  }
  .field input[type="file"] {
    width: 100%;
    background: #111318;
    border: 1px solid #1f2937;
    border-radius: 6px;
    padding: 10px 12px;
    color: #e5e7eb;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .field textarea {
    width: 100%;
    height: 120px;
    background: #111318;
    border: 1px solid #1f2937;
    border-radius: 6px;
    padding: 10px 12px;
    color: #e5e7eb;
    font-family: inherit;
    font-size: 12px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
  }
  .field textarea:focus { border-color: #193B92; }
  .field textarea::placeholder { color: #4b5563; font-style: italic; }
  .post {
    background: #ffffff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,0.2);
  }
  .post-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid #f0f2f5;
  }
  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #193B92;
  }
  .meta { line-height: 1.2; }
  .name {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #050505;
  }
  .sub {
    font-size: 12px;
    color: #65676b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .media {
    background: #f0f2f5;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .media img { width: 100%; display: block; }
  .empty {
    color: #b0b3b8;
    font-size: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .body-text {
    padding: 14px 16px 16px;
    font-size: 15px;
    line-height: 1.5;
    color: #050505;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    white-space: pre-wrap;
  }
  .actions {
    display: flex;
    gap: 4px;
    padding: 6px 12px 10px;
    border-top: 1px solid #f0f2f5;
  }
  .btn {
    flex: 1;
    text-align: center;
    padding: 6px;
    border-radius: 6px;
    background: #f0f2f5;
    color: #65676b;
    font-size: 13px;
    font-weight: 500;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    cursor: default;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="toggle">
      <button id="mode-desktop" class="active">Desktop</button>
      <button id="mode-mobile">Mobile</button>
    </div>
    <div class="toolbar">
      <div class="field">
        <label>Image</label>
        <input type="file" id="file" accept="image/*">
      </div>
      <div class="field">
        <label>Caption</label>
        <textarea id="caption" placeholder="Paste post text here..."></textarea>
      </div>
      <div class="field" style="justify-content:flex-end">
        <button id="download" style="background:#193B92;color:#fff;border:none;border-radius:6px;padding:10px 16px;font-family:inherit;font-size:12px;text-transform:uppercase;letter-spacing:0.12em;cursor:pointer;font-weight:600;">Download PNG</button>
      </div>
    </div>

    <div class="post" id="post">
      <div class="post-header">
        <div class="avatar"></div>
        <div class="meta">
          <div class="name">TechTutor Academy</div>
          <div class="sub">Sponsored · Now</div>
        </div>
      </div>
      <div class="media">
        <div id="empty" class="empty">No image selected</div>
        <img id="img" style="display:none" alt="">
      </div>
      <div id="text" class="body-text"></div>
      <div class="actions">
        <div class="btn">Like</div>
        <div class="btn">Comment</div>
        <div class="btn">Share</div>
      </div>
    </div>
  </div>

<script>
  const fileInput = document.getElementById('file');
  const captionInput = document.getElementById('caption');
  const img = document.getElementById('img');
  const empty = document.getElementById('empty');
  const textEl = document.getElementById('text');
  const post = document.getElementById('post');
  const btnDesktop = document.getElementById('mode-desktop');
  const btnMobile = document.getElementById('mode-mobile');

  function setMode(mode) {
    btnDesktop.classList.toggle('active', mode === 'desktop');
    btnMobile.classList.toggle('active', mode === 'mobile');
    post.style.maxWidth = mode === 'mobile' ? '375px' : '600px';
    post.style.margin = mode === 'mobile' ? '0 auto' : '0';
  }
  btnDesktop.addEventListener('click', () => setMode('desktop'));
  btnMobile.addEventListener('click', () => setMode('mobile'));

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    img.src = URL.createObjectURL(file);
    img.style.display = 'block';
    empty.style.display = 'none';
  });

  captionInput.addEventListener('input', () => {
    textEl.textContent = captionInput.value;
  });

  document.getElementById('download').addEventListener('click', async () => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    script.onload = async () => {
      const el = document.getElementById('post');
      const canvas = await html2canvas(el, { backgroundColor: null, scale: 2 });
      const a = document.createElement('a');
      a.download = 'techtutor-post.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    };
    document.head.appendChild(script);
  });
</script>
</body>
</html>
