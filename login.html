<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechTutor Academy</title>
    <link rel="icon" type="image/png" href="images/robot-rocket.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#193b92',
                        'primary-light': '#2952b8',
                        'primary-dark': '#0f2861',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="w-full max-w-md mx-auto p-6">
        <!-- Logo -->
        <div class="text-center mb-8">
            <img src="images/robot-rocket.png" alt="TechTutor" class="w-24 h-24 mx-auto mb-4">
            <h1 class="text-3xl font-bold text-white mb-2">TechTutor Academy</h1>
            <p class="text-white/80">Sign in to your account</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">
                        Username / Student ID
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-primary focus:outline-none transition"
                        placeholder="Enter your username or student ID"
                        required
                    />
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-primary focus:outline-none transition"
                        placeholder="Enter your password"
                        required
                    />
                </div>

                <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
                    Invalid username or password. Please try again.
                </div>

                <button
                    type="submit"
                    class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-3 rounded-lg transition transform hover:scale-[1.02]"
                >
                    Login
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-gray-200 text-center">
                <a href="index.html" class="text-sm text-gray-600 hover:text-primary transition">
                    ← Back to Home
                </a>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'Techtutor@0987';
        const STORAGE_KEY = 'techtutor_students';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            // Hide error message
            errorMessage.classList.add('hidden');

            // Check if admin
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                // Admin login
                localStorage.setItem('techtutor_admin_auth', 'true');
                window.location.href = 'admin-portal.html';
                return;
            }

            // Check if student
            const students = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const student = students.find(s => s.id === username && s.password === password);

            if (student) {
                // Student login
                localStorage.setItem('techtutor_student_logged_in', username);
                window.location.href = 'student-portal.html';
                return;
            }

            // Invalid credentials
            errorMessage.classList.remove('hidden');
        });
    </script>
</body>
</html>
