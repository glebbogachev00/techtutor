<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4MZ1XEZXB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-4MZ1XEZXB6');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechTutor Academy</title>
    <link rel="icon" type="image/png" href="../images/robot-rocket.png" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#193b92',
                        'primary-light': '#2952b8',
                        'primary-dark': '#0f2861',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>

  <!-- SEO: Hreflang tags for multilingual support -->
  <link rel="alternate" hreflang="en" href="https://techtutor.academy/en/login.html" />
  <link rel="alternate" hreflang="vi" href="https://techtutor.academy/vn/login.html" />
  <link rel="alternate" hreflang="x-default" href="https://techtutor.academy/en/login.html" />
  <link rel="canonical" href="https://techtutor.academy/en/login.html" />
</head>
<body>
    <div class="w-full max-w-md mx-auto p-6">
        <!-- Logo -->
        <div class="text-center mb-8">
            <img src="../images/robot-rocket.png" alt="TechTutor" class="w-24 h-24 mx-auto mb-4">
            <h1 class="text-3xl font-bold text-white mb-2">TechTutor Academy</h1>
            <p class="text-white/80">Sign in to your account</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <form id="loginForm" class="space-y-6">
                <!-- Error Message -->
                <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
                    <p class="text-sm font-medium"></p>
                </div>

                <!-- Success Message -->
                <div id="successMessage" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg">
                    <p class="text-sm font-medium"></p>
                </div>

                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                        Email
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition"
                        placeholder="Enter your email"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                        Password
                    </label>
                    <div class="relative">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition pr-12"
                            placeholder="Enter your password"
                        >
                        <button
                            type="button"
                            onclick="togglePasswordVisibility('password', 'togglePasswordIcon')"
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 focus:outline-none"
                        >
                            <svg id="togglePasswordIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    id="loginButton"
                    class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3 px-4 rounded-lg transition duration-200 transform hover:scale-105"
                >
                    Sign In
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">Need help?</span>
                </div>
            </div>

            <!-- Help Links -->
            <div class="text-center space-y-2">
                <p class="text-sm text-gray-600">
                    <a href="/en/" class="text-primary hover:text-primary-dark font-medium">
                        ← Back to Home
                    </a>
                </p>
                <p class="text-xs text-gray-500">
                    Forgot your password?<br>
                    Contact hello@techtutor.academy
                </p>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg p-6 flex items-center space-x-4">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
                <span class="text-gray-700 font-medium">Signing in...</span>
            </div>
        </div>
    </div>

    <!-- Supabase Client -->
    <script src="../js/supabase-client.js"></script>

    <script>
        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // Toggle password visibility
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                `;
            } else {
                input.type = 'password';
                icon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                `;
            }
        }

        // Show error message
        function showError(message) {
            errorMessage.querySelector('p').textContent = message;
            errorMessage.classList.remove('hidden');
            successMessage.classList.add('hidden');
            setTimeout(() => {
                errorMessage.classList.add('hidden');
            }, 5000);
        }

        // Show success message
        function showSuccess(message) {
            successMessage.querySelector('p').textContent = message;
            successMessage.classList.remove('hidden');
            errorMessage.classList.add('hidden');
        }

        // Show loading state
        function setLoading(isLoading) {
            if (isLoading) {
                loadingOverlay.classList.remove('hidden');
                loginButton.disabled = true;
                loginButton.textContent = 'Signing in...';
            } else {
                loadingOverlay.classList.add('hidden');
                loginButton.disabled = false;
                loginButton.textContent = 'Sign In';
            }
        }

        // Handle form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }

            setLoading(true);

            try {
                // Sign in with Supabase
                const { data, error } = await TechTutorAPI.signIn(email, password);

                if (error) {
                    throw new Error(error.message);
                }

                if (!data?.user) {
                    throw new Error('Invalid credentials');
                }

                showSuccess('Login successful! Redirecting...');

                // Check if user is admin
                const admin = await TechTutorAPI.isAdmin();

                // Store session info in localStorage for backward compatibility
                localStorage.setItem('techtutor_session', JSON.stringify({
                    userId: data.user.id,
                    email: data.user.email,
                    isAdmin: admin,
                    loginTime: new Date().toISOString()
                }));

                // Redirect based on role
                setTimeout(() => {
                    if (admin) {
                        window.location.href = 'admin-portal.html';
                    } else {
                        window.location.href = 'student-portal.html';
                    }
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                setLoading(false);

                let errorMsg = 'Login failed. Please check your credentials.';

                if (error.message.includes('Invalid login credentials')) {
                    errorMsg = 'Invalid email or password';
                } else if (error.message.includes('Email not confirmed')) {
                    errorMsg = 'Please verify your email address first';
                } else if (error.message) {
                    errorMsg = error.message;
                }

                showError(errorMsg);
            }
        });

        // Removed auto-redirect on page load
        // Users can manually navigate to login page even if already logged in

        // Demo credentials helper (for testing)
        if (window.location.search.includes('demo=true')) {
            console.log('=== DEMO MODE ===');
            console.log('Use these credentials:');
            console.log('Admin: admin@techtutor.academy / [your admin password]');
            console.log('================');
        }
    </script>
</body>
</html>
