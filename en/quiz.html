<html lang="en">
<head>

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#171717;--muted:#5f6368;--line:#d9dde5;--accent:#193B92;--accent-soft:#eef2fb}
  html{-webkit-text-size-adjust:100%}
  body{background:#fff;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.6;font-size:16px}
  a{color:inherit}

  .top{max-width:640px;margin:0 auto;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    font-size:24px;font-weight:900;letter-spacing:-.025em;text-decoration:none;line-height:1}
  .brand .b1{color:#193b92}
  .brand .b2{color:#14b8a6}
  .back{font-size:13px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
  .back:hover{color:var(--accent);border-color:var(--accent)}

  main{max-width:640px;margin:0 auto;padding:12px 24px 90px;min-height:60vh}

  /* progress */
  .dots{display:flex;gap:6px;margin-bottom:30px}
  .dot{height:4px;flex:1;border-radius:99px;background:var(--line)}
  .dot.done{background:var(--accent)}

  h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(26px,4.6vw,34px);
    line-height:1.2;letter-spacing:-.01em;margin-bottom:26px}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{font-family:inherit;font-size:16px;font-weight:500;color:var(--ink);text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px 18px;cursor:pointer;
    transition:border-color .15s ease,background .15s ease}
  .opt:hover{border-color:var(--accent);background:var(--accent-soft)}

  .agesel{width:100%;font-family:inherit;font-size:17px;font-weight:500;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23193B92' stroke-width='1.8' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;background-position:right 18px center}
  .agesel:focus{outline:2px solid var(--accent);outline-offset:1px}
  .hint{margin-top:12px;font-size:13.5px;color:var(--muted)}

  .nav{margin-top:26px;display:flex;align-items:center;gap:14px;min-height:24px}
  .prev{font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;padding:0}
  .prev:hover{color:var(--accent)}
  .step{font-size:13px;color:var(--muted)}

  /* result */
  .result{display:none}
  .result.on{display:block}
  .r-kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
  .r-name{font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(30px,5.4vw,40px);line-height:1.1;margin-bottom:12px}
  .r-why{font-size:17px;color:#333;margin-bottom:8px}
  .r-meta{font-size:14px;color:var(--muted);margin-bottom:24px}
  .r-cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
  .btn{display:inline-block;text-decoration:none;font-size:15px;font-weight:600;border-radius:10px;padding:14px 24px}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#122f77}
  .btn-ghost{border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .r-alt{border-top:1px solid var(--line);padding-top:18px;font-size:15px;color:var(--muted)}
  .r-alt a{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid rgba(25,59,146,.3)}
  .r-alt a:hover{border-color:var(--accent)}
  .again{margin-top:22px;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);
    background:none;border:none;cursor:pointer;padding:0;text-decoration:underline}
  .again:hover{color:var(--accent)}

  button{touch-action:manipulation}

  @media (max-width:600px){
    .top{padding:18px 20px}
    main{padding:12px 20px 70px}
    .opt{font-size:16px;padding:16px}
    .r-cta{flex-direction:column}
    .btn{text-align:center}
  }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="/en/index.html" aria-label="TechTutor home"><span class="b1">Tech</span><span class="b2">Tutor</span></a>
  <a class="back" href="/en/index.html">&larr; Main page</a>
</header>

<main>
  <div class="dots" id="dots"></div>

  <div id="quiz">
    <h1 id="q"></h1>
    <div class="opts" id="opts"></div>
    <div class="nav">
      <button class="prev" id="prev" type="button" hidden>← Back</button>
      <span class="step" id="step"></span>
    </div>
  </div>

  <div class="result" id="result">
    <p class="r-kicker">Best fit</p>
    <h2 class="r-name" id="rName"></h2>
    <p class="r-why" id="rWhy"></p>
    <p class="r-meta" id="rMeta"></p>
    <div class="r-cta">
      <a class="btn btn-primary" id="rTry" href="#">Try it in 1 minute</a>
      <a class="btn btn-ghost" href="/en/free-trial.html">Book a free trial</a>
    </div>
    <p class="r-alt" id="rAlt"></p>
    <button class="again" id="again" type="button">Start again</button>
  </div>
</main>

<script>
(function(){
  var P = {
    scratch:  { n:'Scratch Game Coder',     from:7,  to:12, x:'scratch-explained.html' },
    gdevelop: { n:'GDevelop Game Designer', from:8,  to:14, x:'gdevelop-explained.html' },
    roblox:   { n:'Roblox World Creator',   from:9,  to:15, x:'roblox-explained.html' },
    web:      { n:'Website Creation',       from:10, to:16, x:'web-development-explained.html' },
    d3:       { n:'3D Designer',            from:10, to:16, x:'3d-design-explained.html' },
    app:      { n:'App Development',        from:10, to:17, x:'app-development-explained.html' },
    genai:    { n:'Generative AI Magic',    from:10, to:17, x:'generative-ai-explained.html' },
    ai:       { n:'AI & Programming Quest', from:11, to:16, x:'ai-programming-explained.html' },
    startup:  { n:'Startup Foundations',    from:10, to:17, x:'startup-explained.html' }
  };

  var Q = [
    { q:'How old are they?', age:true },

    { q:'What do they gravitate to when nobody is telling them what to do?', a:[
      { t:'Games — playing them, talking about them', s:{gdevelop:3,roblox:3,scratch:1} },
      { t:'Drawing, designing, making things look right', s:{d3:3,genai:2,web:1} },
      { t:'Taking things apart to see how they work', s:{ai:3,web:2,app:1} },
      { t:'Ideas and plans — they talk people into things', s:{startup:3,app:1} } ] },

    { q:'Have they written any code before?', a:[
      { t:'Never', s:{scratch:3,gdevelop:2,ai:-3,startup:-2,web:-1} },
      { t:'A bit of Scratch or something like it', s:{gdevelop:2,roblox:2,web:1} },
      { t:'Yes — actual typed code', s:{web:2,ai:3,startup:2,app:1,scratch:-4} } ] },

    { q:'What would they most love to show someone?', a:[
      { t:'A game their friends can play', s:{roblox:3,gdevelop:3} },
      { t:'A website or app people actually use', s:{web:3,app:3} },
      { t:'A picture or character they made', s:{d3:3,genai:3} },
      { t:'Something they invented that solves a problem', s:{startup:3,app:2} } ] },

    { q:'When something gets frustrating, they usually…', a:[
      { t:'Keep poking at it until it works', s:{ai:1,startup:1,web:1} },
      { t:'Want someone sitting alongside them', s:{scratch:1,gdevelop:1} },
      { t:'Lose interest and move to something else', s:{roblox:2,genai:2,scratch:1} } ] }
  ];

  var WHY = {
    scratch:  'It starts before code — mouse, keyboard, files — then builds up to real games in blocks they can read back to you.',
    gdevelop: 'Games built out of readable rules rather than typing, so the thinking is the hard part instead of the syntax.',
    roblox:   'It turns the thing they already do for hours into something they publish, which is the shortest route from habit to building.',
    web:      'Change a line, refresh, see it. The fastest feedback loop in programming, ending in a link anyone can open.',
    d3:       'It rewards visual judgement first and brings the technical side in gradually — every week produces an image.',
    app:      'Design and logic side by side, ending with something that installs on a phone and can be handed to you.',
    genai:    'It teaches judgement rather than button-pressing: getting the right output, not accepting the first one.',
    ai:       'Real Python and trained models, including watching their own model go wrong because of the data they chose.',
    startup:  'The only one where the goal is a real user rather than a finished exercise — ideal when they already have an idea.'
  };

  var dotsEl=document.getElementById('dots'), qEl=document.getElementById('q'), optsEl=document.getElementById('opts'),
      stepEl=document.getElementById('step'), prevBtn=document.getElementById('prev'),
      quizEl=document.getElementById('quiz'), resEl=document.getElementById('result');
  var i=0, answers=[];

  Q.forEach(function(){ var d=document.createElement('span'); d.className='dot'; dotsEl.appendChild(d); });

  function paintDots(){
    Array.prototype.forEach.call(dotsEl.children, function(d,n){ d.classList.toggle('done', n <= i-1); });
  }

  function show(){
    if (i >= Q.length){ finish(); return; }
    var item=Q[i];
    qEl.textContent=item.q;
    optsEl.innerHTML='';

    if (item.age){
      var sel=document.createElement('select');
      sel.className='agesel';
      sel.setAttribute('aria-label','Your child\'s age');
      var opts=['Choose an age','6 or under'];
      for (var y=7;y<=17;y++) opts.push(String(y));
      opts.push('18 or older');
      opts.forEach(function(label,n){
        var o=document.createElement('option');
        o.value = n===0 ? '' : (n===1 ? 'under' : (label==='18 or older' ? 'over' : label));
        o.textContent = label;
        if (n===0){ o.disabled=true; o.selected=true; }
        sel.appendChild(o);
      });
      if (answers[i] != null) sel.value = answers[i];
      sel.addEventListener('change', function(){
        answers[i]=sel.value;
        // no point asking four more questions if we already cannot help
        if (sel.value==='under' || sel.value==='over'){ outOfRange(sel.value); return; }
        i++; paintDots(); show();
      });
      optsEl.appendChild(sel);
      var h=document.createElement('p'); h.className='hint';
      h.textContent='We teach 7 to 17 — pick the closest age.';
      optsEl.appendChild(h);
      prevBtn.hidden = i === 0;
      stepEl.textContent = 'Question ' + (i+1) + ' of ' + Q.length;
      paintDots();
      return;
    }

    item.a.forEach(function(opt,n){
      var b=document.createElement('button');
      b.type='button'; b.className='opt'; b.textContent=opt.t;
      b.addEventListener('click',function(){ answers[i]=n; i++; paintDots(); show(); });
      optsEl.appendChild(b);
    });
    prevBtn.hidden = i === 0;
    stepEl.textContent = 'Question ' + (i+1) + ' of ' + Q.length;
    paintDots();
  }

  function outOfRange(kind){
    document.getElementById('rName').textContent = kind==='under' ? 'A little early' : 'Worth a conversation';
    document.getElementById('rWhy').textContent = kind==='under'
      ? 'Our youngest program, Scratch Game Coder, is written for 7 and up — it starts with mouse, keyboard and file skills before any code. At 6 it genuinely depends on the child.'
      : 'These nine programs are built for 7 to 17, and the pacing assumes that. Past 18 the material still stands up, but a path built around what you want to make is the honest route.';
    document.getElementById('rMeta').textContent='';
    var t=document.getElementById('rTry');
    t.setAttribute('href', kind==='under' ? '/en/free-trial.html' : '/en/custom-courses.html');
    t.textContent = kind==='under' ? 'Book a free trial' : 'See custom courses';
    document.getElementById('rAlt').innerHTML = kind==='under'
      ? 'We will tell you honestly whether to wait a year.'
      : 'Tell us what you want to build and we will say whether we can help.';
    quizEl.style.display='none'; resEl.classList.add('on');
    Array.prototype.forEach.call(dotsEl.children,function(d){ d.classList.add('done'); });
  }

  function finish(){
    var a0=answers[0];
    if (a0==='under' || a0==='over'){ outOfRange(a0); return; }
    var age=parseInt(a0,10);
    var band=[age,age];
    var score={};
    Object.keys(P).forEach(function(k){ score[k]=0; });
    for (var n=1;n<Q.length;n++){
      var s=Q[n].a[answers[n]].s || {};
      Object.keys(s).forEach(function(k){ score[k]+=s[k]; });
    }
    // only programs whose age range overlaps the band they chose
    var eligible=Object.keys(P).filter(function(k){ return P[k].from <= band[1] && P[k].to >= band[0]; });
    eligible.sort(function(a,b){ return score[b]-score[a]; });
    var top=eligible[0], alt=eligible[1];

    document.getElementById('rName').textContent=P[top].n;
    document.getElementById('rWhy').textContent=WHY[top];
    document.getElementById('rMeta').textContent='Ages ' + P[top].from + '–' + P[top].to +
      ' · 24 lessons over 3 levels · 90-minute live sessions';
    var tryBtn=document.getElementById('rTry');
    tryBtn.setAttribute('href', P[top].x);
    tryBtn.textContent='Try it in 1 minute';
    document.getElementById('rAlt').innerHTML = alt
      ? 'Also worth a look: <a href="' + P[alt].x + '">' + P[alt].n + '</a>.'
      : '';
    quizEl.style.display='none';
    resEl.classList.add('on');
    Array.prototype.forEach.call(dotsEl.children,function(d){ d.classList.add('done'); });
  }

  prevBtn.addEventListener('click',function(){ if(i>0){ i--; paintDots(); show(); } });
  document.getElementById('again').addEventListener('click',function(){
    i=0; answers=[]; resEl.classList.remove('on'); quizEl.style.display=''; show();
  });

  show();
})();
</script>

</body>
</html>
